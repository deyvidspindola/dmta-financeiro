server {
    listen 80;
    server_name localhost;

    # O Laravel serve a partir de public/ — igual à produção, onde o
    # document root do painel aponta só para cá (nunca o projeto inteiro).
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 24M;

    # DNS interno do Docker: re-resolve "app" se o contêiner for recriado
    # (sem isso, o nginx fica com IP antigo e devolve 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA do apps/web publicada em public/app/ (mesmo document root da
    # API, subpasta — espelha $WEB_ROOT/app/ da produção real, ver
    # docs/02_CI_CD.md). Equivalente ao apps/web/public/.htaccess
    # (Apache) que a produção usa — aqui é nginx, então o fallback de
    # rota do React Router (basename="/app") precisa do próprio bloco:
    # sem isso, dar F5 numa rota interna como /app/dashboard cai no
    # roteador do Laravel (404 dele) em vez de voltar pro index.html.
    location /app/ {
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
