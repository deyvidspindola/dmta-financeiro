; Limites pensados para hospedagem compartilhada (HostGator/cPanel).
; Se a produção real do projeto derivado usar outros limites, mude aqui
; junto — é isso que evita "funciona no meu notebook, quebra no cliente".

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 24M
max_input_vars = 3000

date.timezone = America/Sao_Paulo

; Desenvolvimento: erro na tela ajuda. Em produção isso é APP_DEBUG=false.
display_errors = On
error_reporting = E_ALL

; Sentry: argumentos no stack trace de exceções (Off = incluir).
zend.exception_ignore_args = Off

opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
