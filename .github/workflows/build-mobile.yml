name: Build mobile (Expo)

# Gatilho manual apenas — build EAS consome cota, não deve rodar a cada
# push. apps/mobile só é criado na F3 (ver docs/fases/F3_app_expo.md); até
# lá este workflow existe mas não tem o que buildar.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil do EAS Build'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    name: EAS Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Preparar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive
